<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNAKE — Spelet</title>
  <link rel="stylesheet" href="style.css">
</head>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  socket.on('starta_spel', () => {
    startaSpel();
  });

  socket.on('fullt', () => {
    alert('Spelet är fullt, försök igen senare!');
  });

  socket.on('spelare_borta', () => {
    alert('Den andra spelaren kopplade från!');
  });
</script>
<body>

 <img src="Start_skärmen!.png" height="500"  style="float: left; margin-right: 250px;">>

  <div class="scanlines"></div>

 <main class="game-layout">
    <div class="game-header">
      <div class="score-panel left">
        <div class="score-name" id="namn1">SPELARE 1</div>
        <div class="score-val" id="poang1">0</div>
        <div class="score-controls">WASD</div>
      </div>

      <div class="game-title-wrap">
        <div class="game-status">Inväntar spelare...</div>
      </div>

     <div class="score-panel right">
        <div class="score-name" id="namn2">SPELARE 2</div>
        <div class="score-val" id="poang2">0</div>
        <div class="score-controls">PILTANGENTER</div>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="spelplan" width="560" height="420"></canvas>
